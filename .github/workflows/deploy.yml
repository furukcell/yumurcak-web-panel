name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # FIREBASE_SERVICE_ACCOUNT sırrı GitHub repo Settings > Secrets and
      # variables > Actions kısmından eklenmeli. Nasıl alınacağı
      # README.md > "Bir Kerelik Kurulum" bölümünde anlatılıyor.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: yumurcak-app
          channelId: live
