name: Fix SuperAdmin setup route

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'route superadmin setup to partial onboarding') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch SuperAdmin route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace("import SuperAdminKurumKurulum from '../superadmin/SuperAdminKurumKurulum';", "import SuperAdminBulkOnboarding from '../superadmin/SuperAdminBulkOnboarding';")
          s = s.replace("<Route path=\"toplu-kurulum\" element={b(<SuperAdminKurumKurulum/>)} />", "<Route path=\"toplu-kurulum\" element={b(<SuperAdminBulkOnboarding/>)} />")
          p.write_text(s)
          PY
      - name: Commit route fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git diff --cached --quiet || git commit -m 'fix: route superadmin setup to partial onboarding'
          git push